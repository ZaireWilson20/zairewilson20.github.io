    contents:
    - title: Project Overview & Architecture
      image:
      description: |
          <p>Five Mics is a hip-hop inspired trading card game that connects physical play with a digital client. I own the Unity client, the server-authoritative flow, and the card-authoring pipeline.</p>
          <p><b>Main problems I solved:</b></p>
          <li>Make abilities data-driven so we don’t hardcode every card</li>
          <li>Keep the server in charge (FishNet) so PvP is fair</li>
          <li>Give non-programmers a clean Inspector to build cards</li>
    - title: Tech Stack
      image:
      description: |
          <p><b>Game / Client</b></p>
          <li>Unity 6000.2.1f1</li>
          <li>C#</li>
          <li>ScriptableObjects (data-driven cards)</li>
          <li>UnityEditor IMGUI (custom Inspectors)</li>
          <li>FishNet (server-authoritative networking)</li>

          <p><b>Backend</b></p>
          <li>.NET / ASP.NET Core Web API</li>
          <li>HttpClient for Edgegap integration</li>

          <p><b>Build / Hosting</b></p>
          <li>Docker</li>
          <li>GitHub Actions</li>
          <li>Edgegap (game servers)</li>
          <li>DigitalOcean (API host)</li>

    - title: Card Ability System — Triggers → Filters → Actions
      image: "ability-example.gif"
      description: |
          <p>Every card ability follows the same pattern: an event happens, we pick targets, we run actions. That’s what lets designers make complex effects just by filling out fields.</p>
          <p><b>Core ScriptableObject types:</b></p>
          <li><b>CardAbility</b> — holds the triggers and what they do</li>
          <li><b>TargetFilterSO</b> — finds the cards/players to affect</li>
          <li><b>CardAbilityConditionSO</b> — optional checks before running</li>
          <li><b>CardActionSO</b> — the actual effect (draw, damage, move, etc.)</li>
          <p>Below is the actual structure used in-game:</p>
          <div class="highlight"><pre><code class="language-csharp">[Serializable]
            public class CardAbility
            {
                public AbilityModifierType GetActivatorType; // e.g., category/activator mode
                public List&lt;StateEventTrigger&gt; StateEventTriggers = new();
            }

            [Serializable]
            public class StateEventTrigger
            {
                public StateEventTypes StateEventType;                 // Card/Game/Player/Action-based
                public string GameStateEventTrigger;                   // event asset name (game)

                public string FilterForCardsThatTriggerName;           // TargetFilterSO name
                public string ParamsKey;                               // param namespace

                public List&lt;ActionFilterPair&gt; ActionFilterPairs = new();
            }

            [Serializable]
            public class ActionFilterPair
            {
                public CardActionSO CardAction;
                public bool UseFilter;
                public TargetFilterSO TargetFilter;

                public bool UseActionCondition;
                public CardAbilityConditionSO Condition;

                public bool IsSkippable;
                public bool IsChainedAction;
            }
            </code></pre></div>
                    <p>All of these expose parameters through a shared interface, so the Inspector can draw them.</p>
            <div class="highlight"><pre><code class="language-csharp">
            public interface IParamProvider
            {
                ParameterDefinition[] GetParamDefs();
            }

            public sealed class ParameterDefinition
            {
                public string Key;               // e.g. "TargetCount"
                public ParamFieldType FieldType; // Int/Float/Bool/String/Enum/ScriptableObject
                public ParamValueSource ValueSource;
                public object DefaultValue;
                public string Description;
            }
            </code></pre></div>

    - title: Event-Driven Resolution with State Machine Hooks
      image:
      description: |
          <p>Instead of one giant “ability runner,” abilities respond to game/card/player state changes. When the game says “turn started” or “card entered play,” the matching triggers run.</p>
          <p><b>Flow:</b></p>
          <ol>
            <li>State manager broadcasts an event</li>
            <li>Triggers that care about that event fire</li>
            <li>Filters pick targets, conditions check rules</li>
            <li>Actions execute (and can chain)</li>
          </ol>
          <p>This keeps the system modular and easy to extend.</p>

    - title: Server-Authoritative Networking with FishNet
      image:
      description: |
          <p>Clients never “force” game state. They ask; the server checks; the server updates everyone. That prevents cheating and desyncs.</p>
          <div class="highlight"><pre><code class="language-csharp">public class CardPlayHandler : NetworkBehaviour
            {
                // CLIENT — player wants to play a card
                [Client]
                public void RequestPlayCard(int cardId, int targetId)
                {
                    ServerPlayCard(cardId, targetId);
                }

                // SERVER — validate + run gameplay
                [ServerRpc]
                private void ServerPlayCard(int cardId, int targetId)
                {
                    var player = GetPlayerFromConnection();
                    var card = GameState.GetCard(cardId);
                    var target = GameState.GetTarget(targetId);

                    if (!IsPlayerTurn(player)) return;
                    if (!player.Hand.Contains(card)) return;
                    if (!card.IsValidTarget(target)) return;

                    player.Hand.Remove(card);
                    GameState.PlayCard(card, target);
                    card.QueueCardAbilityExecution();

                    ObserversCardPlayed(cardId, targetId, player.NetworkId);
                }

                // CLIENTS — animate/update UI
                [ObserversRpc]
                private void ObserversCardPlayed(int cardId, int targetId, int playerId)
                {
                    // animate + UI
                }
            }
            </code></pre></div>

    - title: Card Authoring Tooling — Custom Inspector (IMGUI)
      image: "card-creator-example.png"
      description: |
          <p>The Unity editor shows all actions/filters/conditions automatically, based on the interfaces above. Designers just pick from dropdowns and fill in params.</p>
          <li>Configure triggers for card/game/player events</li>
          <li>Pick actions and optional conditions</li>
          <li>Inspector auto-draws fields from <b>IParamProvider</b></li>
          <li>Shared context keys for game-aware values</li>
    - title: Game API (ASP.NET Core gateway)
      image:
      description: |
          <p>I run a small ASP.NET Core API in front of Edgegap so the Unity client only talks to <i>our</i> service, not Edgegap directly. That lets me hide tokens, control room naming, and swap infra later without a new client build.</p>

          <p><b>What it does:</b></p>
          <li><b>POST /api/sessions/create</b> — make a room, using the client IP + room name, and make sure the right app version is loaded from remote config.</li>
          <li><b>POST /api/sessions/join</b> — lets a client join an existing room by name/id, resolving it through the API’s room-name service instead of hitting Edgegap directly </li>
          <li>If Edgegap doesn’t have a deployment yet, the API creates one and waits for Edgegap’s “deployment-ready” webhook before returning to the client.</li>
          <li>Keeps a room-name cache separate from Edgegap so players can join by name, not by session id.</li>
          <li>Has a “test” set of endpoints to create/join sessions without hitting Edgegap for local/dev play.</li>

          <p><b>Webhook flow:</b> Edgegap calls our "deployment-ready" endpoint → API completes the pending wait → then creates the actual session and returns it to Unity. That’s how I keep the client from polling Edgegap itself. </p>

          <p><b>Config:</b> app versions are pulled from a private GitHub repo and can be reloaded with by hitting our reload endpoint, so sessions always use the right build. </p>

          <p>Registered with DI, CORS for Unity, forwarded headers for nginx, and a named HttpClient for Edgegap.</p>

    - title: DevOps & Infrastructure
      image:
      description: |
          <b>Cloud:</b>
          <li>DigitalOcean droplet running ASP.NET Core behind nginx</li>
          <li>Edgegap for dedicated game servers</li>
          <li>GitHub Actions + Docker for CI/CD</li>
          <b>Config & Security:</b>
          <li>Remote config from private GitHub</li>
          <li>Env-specific builds and secrets</li>
          <b>Reliability:</b>
          <li>Webhook health checks</li>
          <li>CORS tuned for Unity clients</li>

    - title: Results & Crowdfunding
      image: "crowdfunding.png"
      description: |
          <p>With the core systems in place, we were able to ship a multiplayer demo and fundraise.</p>
          <li><b>$17K raised</b> from 160+ backers</li>
