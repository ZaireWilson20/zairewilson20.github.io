{% assign profile = site.theme_settings.profile %}


</div><!-- This Tag means End .container -->

    <div class="container-fluid">
      <div class="row">
        <div class="img-wrap col-12 col-md-4">
          <div class="img">
            <img src="{{ site.baseurl }}/{{ profile.image }}" alt="user_image">

        </div>

      </div>

        <a href="https://drive.google.com/file/d/1LzSuUHrMmvp9Jm8mooYciWyBgP7y3DGD/view?usp=sharing" target="_blank"  class="btn-wrap col-4" style="padding-left: 0;">

            RESUME LINK
          </p>
        </a>
      </div>
    </div>
    <div class="bg"></div>
  </section>
  {% include projects.html %}
  <!-- career section -->

    document.addEventListener("DOMContentLoaded", function () {
        Prism.highlightAll();
    });
